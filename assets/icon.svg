<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Count Darcula">
  <defs>
    <linearGradient id="cape" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e58ed9"/>
      <stop offset="1" stop-color="#8a66cf"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0.75" y2="1">
      <stop offset="0" stop-color="#332a3e"/>
      <stop offset="1" stop-color="#20232c"/>
    </linearGradient>
    <clipPath id="head"><circle cx="64" cy="47" r="21"/></clipPath>
  </defs>

  <rect width="128" height="128" rx="27" fill="url(#bg)"/>
  <rect x=".75" y=".75" width="126.5" height="126.5" rx="26.25" fill="none" stroke="#e58ed9" stroke-opacity=".25" stroke-width="1.5"/>

  <!-- the collar: two sharp peaks, which is the whole silhouette -->
  <path d="M64 86 L27 52 L34 110 Z" fill="url(#cape)"/>
  <path d="M64 86 L101 52 L94 110 Z" fill="url(#cape)"/>

  <!-- neck, then shoulders over it -->
  <path d="M56.5 58h15v20h-15Z" fill="#b7bbca"/>
  <path d="M64 74c19 0 30 13 33 36H31c3-23 14-36 33-36Z" fill="#231f2c"/>

  <!-- head -->
  <circle cx="64" cy="47" r="21" fill="#d7dae4"/>
  <!-- hair: clipped to the head so the hairline can never overshoot -->
  <g clip-path="url(#head)">
    <path d="M40 22h48v18l-13 2-11 7-11-7-13-2Z" fill="#231f2c"/>
  </g>

  <!-- eyes -->
  <path d="M51.5 53.5c2.6-3.6 6.8-3.6 9.4 0-2.6 3.6-6.8 3.6-9.4 0Z" fill="#fb5f6a"/>
  <path d="M67.1 53.5c2.6-3.6 6.8-3.6 9.4 0-2.6 3.6-6.8 3.6-9.4 0Z" fill="#fb5f6a"/>

  <!-- fangs -->
  <path d="M58.6 60h4.2l-2.1 6.2Z" fill="#f7f8fc"/>
  <path d="M65.2 60h4.2l-2.1 6.2Z" fill="#f7f8fc"/>

  <!-- the eight-hue band, all at one lightness -->
  <g>
    <circle cx="15" cy="18" r="2.7" fill="#fb8c8d"/>
    <circle cx="15" cy="28" r="2.7" fill="#e4a15f"/>
    <circle cx="15" cy="38" r="2.7" fill="#d3ab54"/>
    <circle cx="15" cy="48" r="2.7" fill="#86c47f"/>
    <circle cx="113" cy="18" r="2.7" fill="#4fc5cb"/>
    <circle cx="113" cy="28" r="2.7" fill="#5dbbf8"/>
    <circle cx="113" cy="38" r="2.7" fill="#be9df7"/>
    <circle cx="113" cy="48" r="2.7" fill="#e58ed9"/>
  </g>
</svg>
