name: build

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # No dependencies: build regenerates themes/, validate checks structure and
      # that the committed JSON matches src/, audit fails on any colour below AA.
      - run: npm test
