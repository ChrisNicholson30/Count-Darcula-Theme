name: build

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No dependencies to install. validate.js runs BEFORE any build, so it can
      # still see committed output that has drifted from src/; audit.js then
      # measures the palette and every foreground in the generated themes.
      - run: npm test

      # Belt and braces: rebuild and prove the committed JSON is byte-identical.
      - name: Generated themes are up to date
        run: |
          npm run build
          git diff --exit-code -- themes/ \
            || { echo "::error::themes/ is stale — run 'npm run build' and commit"; exit 1; }

      # Packaging is part of the contract, so break the build here rather than
      # at release time. The vsce version is pinned in package.json.
      - name: Package
        run: npm run package

      - uses: actions/upload-artifact@v4
        with:
          name: count-darcula-vsix
          path: '*.vsix'
          if-no-files-found: error
